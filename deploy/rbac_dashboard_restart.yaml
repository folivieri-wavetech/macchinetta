apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: macchinetta
  name: macchinetta-restart-role
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: macchinetta
  name: macchinetta-restart-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: macchinetta-restart-role
subjects:
- kind: ServiceAccount
  name: default
  namespace: macchinetta
